services:
  traefik:
    image: traefik:v3.7.3
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=homelab"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - homelab
    mem_limit: 256m
    cpus: 0.25

  # Pi-hole v6 - Network-wide Ad Blocking
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.05.0
    platform: linux/arm64
    hostname: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp" # DHCP (optional)
      - "8080:80/tcp" # Web interface
    environment:
      # Pi-hole v6 password configuration
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-changeme}
      # Pi-hole v6 timezone configuration
      TZ: ${TZ:-America/New_York}
      # Pi-hole v6 DNS upstream servers (separated by semicolons), use your favorite DNS providers
      FTLCONF_dns_upstreams: ${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      # Pi-hole v6 listening mode (ALL for Docker bridge network)
      FTLCONF_dns_listeningMode: all
      # Web interface hostname
      VIRTUAL_HOST: ${PIHOLE_HOSTNAME:-pihole.homelab}
      WEBTHEME: ${PIHOLE_THEME:-default-dark}
      FTLCONF_webserver_api_allowedHosts: pihole.homelab.pilon
      FTLCONF_webserver_api_enabled: true
      # Local DNS entries for .local domains (dict format required for multiline block scalar)
      FTLCONF_misc_dnsmasq_lines: |
        address=/pihole.homelab.pilon/192.168.0.233
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.homelab.pilon`)"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    volumes:
      - ${DISK_PATH:-./data}/pihole/etc:/etc/pihole
      - ${DISK_PATH:-./data}/pihole/dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - homelab
    mem_limit: 512m
    cpus: 0.5

  # Home Assistant - Smart Home Automation
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    platform: linux/arm64
    hostname: homeassistant
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${DISK_PATH:-./data}/homeassistant:/config
    privileged: true
    restart: unless-stopped
    network_mode: host
    # Note: network_mode host uses the host's network directly, HA accessible on port 8123
    mem_limit: 1536m
    cpus: 1.5

  # Portainer - Container Management UI
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    platform: linux/arm64
    hostname: portainer
    ports:
      - "9443:9443" # HTTPS Web UI
      - "9000:9000" # HTTP Web UI (optional)
      - "8000:8000" # Edge agent
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DISK_PATH:-./data}/portainer:/data
    restart: unless-stopped
    networks:
      - homelab
    mem_limit: 512m
    cpus: 0.5

  # Tailscale - VPN (preserved)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host # necessary to expose local services
    privileged: true   # necessary to manipulate the network
    volumes:
      - ${DISK_PATH}/Docker/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    command: sh -c "
      tailscaled &
      sleep 5 &&
      tailscale up \
      --authkey=${TS_AUTHKEY} \
      --advertise-routes=192.168.1.0/24 \
      --advertise-exit-node \
      --hostname=homelab-docker"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    mem_limit: 256m
    cpus: 0.25

  # Watchtower - Automatic Container Updates (preserved)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true       # delete old images
      - WATCHTOWER_POLL_INTERVAL=3600 # update interval in seconds
    mem_limit: 128m
    cpus: 0.25

  # Cloudflared - Cloudflare Tunnel
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    platform: linux/arm64
    hostname: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=${TZ:-America/New_York}
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - homelab
    mem_limit: 256m
    cpus: 0.25

  # SFTPGo - SFTP/FTP/WebDAV Server
  sftpgo:
    container_name: sftpgo
    image: drakkan/sftpgo:latest
    platform: linux/arm64
    hostname: sftpgo
    user: "1000:1000"
    ports:
      - "8081:8080" # Web Admin UI
      - "2022:2022" # SFTP port
      - "2121:2121" # FTP port (optional)
      - "8090:8090" # WebDAV port (optional)
    environment:
      - TZ=${TZ:-America/New_York}
      - SFTPGO_CREATE_DEFAULT_ADMIN=true
      - SFTPGO_DEFAULT_ADMIN_USERNAME=${SFTPGO_ADMIN_USER:-admin}
      - SFTPGO_DEFAULT_ADMIN_PASSWORD=${SFTPGO_ADMIN_PASSWORD:-admin}
      # Data provider configuration
      - SFTPGO_DATA_PROVIDER__DRIVER=bolt
      - SFTPGO_DATA_PROVIDER__NAME=/srv/sftpgo/sftpgo.db
    volumes:
      - ${DISK_PATH:-./data}/sftpgo/data:/srv/sftpgo
      - ${DISK_PATH:-./data}/sftpgo/home:/var/lib/sftpgo
      - ${DISK_PATH:-./data}/sftpgo/backups:/srv/sftpgo/backups
    restart: unless-stopped
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
